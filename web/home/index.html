<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1D4E89" />
    <meta name="description" content="Classroom app for teachers and students: registers, tasks, syllabus notes and exam practice that works offline." />
    <title>Home Study</title>
    <link rel="icon" href="assets/icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icon.svg" />
    <!-- Everything is local (no CDN) so the app works with no internet connection. -->
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app">
      <div style="min-height:100vh;display:grid;place-items:center;color:#5f6b7d;font-family:system-ui,sans-serif">Loading…</div>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <script>
      /* If the app hasn't started after 12 seconds (a damaged file, a broken update), say so with a way out
         instead of leaving "Loading…" or a blank page. The desktop app first goes back to its built-in files. */
      (function () {
        var errs = [];
        window.addEventListener("error", function (e) { errs.push((e && e.message) || "error"); });
        var check = function (late) {
          var A = window.App, started = A && A.Store && A.Store.state;
          if (started) return;
          if (!errs.length && !late) { setTimeout(function () { check(true); }, 33000); return; } // no error yet: a slow computer, give it longer
          var msg = errs.join("; ") || "it did not finish starting";
          var show = function () {
            document.getElementById("app").innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#1f2933;padding:24px">' +
              '<div style="max-width:440px;text-align:center"><h2 style="margin:0 0 8px">School Assist could not start</h2><p style="color:#5f6b7d;margin:0 0 16px">Your saved work is safe. Try again; if this keeps happening, restart the computer or call Golden Technologies.</p>' +
              '<button onclick="location.reload()" style="font:inherit;padding:10px 18px;border-radius:8px;border:0;background:#1D4E89;color:#fff;cursor:pointer">Try again</button></div></div>';
          };
          // the desktop app goes back to its built-in files only when a script failed (a broken update), not when slow
          if (errs.length && window.desktop && window.desktop.bootFailed) window.desktop.bootFailed(msg).then(function (r) { if (!r || !r.retried) show(); }, show);
          else show();
        };
        setTimeout(function () { check(false); }, 12000);
      })();
    </script>
    <div id="alert-root" aria-live="assertive"></div>
    <div id="tip" role="tooltip"></div>

    <!-- 1. The school's branding: the only file a school needs to edit. -->
    <script src="school.config.js"></script>
    <!-- 2. Core -->

    <!-- 4. Screens -->
    <script src="js/app.js"></script>

    <script src="js/pdfview.js"></script>

      App.boot();
    </script>
