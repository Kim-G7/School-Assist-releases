<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1D4E89" />
    <meta name="description" content="Classroom app for teachers and students: registers, tasks, syllabus notes and exam practice that works offline." />
    <title>School Assist Teacher</title>
    <link rel="icon" href="assets/icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icon.svg" />
    <!-- Everything is local (no CDN) so the app works with no internet connection. -->
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app">
      <div style="min-height:100vh;display:grid;place-items:center;color:#5f6b7d;font-family:system-ui,sans-serif">Loading…</div>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
    <div id="alert-root" aria-live="assertive"></div>
    <div id="tip" role="tooltip"></div>

    <!-- 1. The school's branding: the only file a school needs to edit. -->
    <script src="school.config.js"></script>
    <!-- 2. Core -->
    <script src="js/util.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/store.js"></script>
    <script src="js/cloud.js"></script>
    <script src="js/model.js"></script>
    <script src="js/ui.js"></script>
    <!-- 3. Demo content (safe to remove once a school has its own data) -->
    <script src="js/seed-syllabi.js"></script>
    <script src="js/seed.js"></script>
    <!-- 4. Screens -->
    <script src="js/app.js"></script>
    <script src="js/screen.js"></script>
    <script src="js/devices.js"></script>
    <script src="js/alerts.js"></script>
    <script src="js/timetable.js"></script>
    <script src="js/materials.js"></script>
    <script src="js/papers.js"></script>
    <script src="js/pdfview.js"></script>
    <script src="js/paperscan.js"></script>
    <script src="js/sitpaper.js"></script>
    <script src="js/marker.js"></script>
    <script src="js/pad.js"></script>
    <script src="js/sitqs.js"></script>
    <script src="js/subjects.js"></script>
    <script src="js/notescan.js"></script>
    <script src="js/tutor.js"></script>
    <script src="js/sylread.js"></script>
    <script src="js/tutoradmin.js"></script>
    <script src="js/primary.js"></script>
    <script src="js/teacher.js"></script>
    <script src="js/student.js"></script>
    <script src="js/exam.js"></script>
    <script src="js/syllabus.js"></script>
    <script src="js/staff.js"></script>
    <script src="js/updates.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/sync.js"></script>
    <script>
      App.boot();
    </script>
  </body>
</html>
